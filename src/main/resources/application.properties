spring.application.name=url-analytics

server.port=8081

spring.datasource.url=jdbc:h2:mem:analytics
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.phh.url.url_analytics.events.UrlClickedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.phh.url.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false